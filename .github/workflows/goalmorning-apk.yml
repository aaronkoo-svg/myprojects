# GoalMorning 안드로이드 설치 파일(APK)을 만들어 GitHub Releases에 올린다.
# main에 GoalMorning 코드가 올라오면 자동 실행, Actions 탭에서 직접 실행도 가능.
name: GoalMorning APK

on:
  push:
    branches: [main]
    paths:
      - 'GoalMorning/**'
      - '.github/workflows/goalmorning-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goalmorning-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: GoalMorning
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: GoalMorning/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build APK
        working-directory: GoalMorning/android
        # 대부분의 안드로이드 폰(64비트 ARM)용으로만 빌드해 시간과 용량을 줄인다
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
        env:
          NODE_ENV: production

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk GoalMorning-${{ github.run_number }}.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: goalmorning-build-${{ github.run_number }}
          name: GoalMorning 테스트 빌드 ${{ github.run_number }}
          prerelease: true
          files: GoalMorning/GoalMorning-${{ github.run_number }}.apk
          body: |
            폰에서 아래 **GoalMorning-${{ github.run_number }}.apk** 를 눌러 내려받고 설치하세요.
            처음 설치할 때 "출처를 알 수 없는 앱 설치"를 허용해야 할 수 있어요.

            커밋: ${{ github.sha }}
